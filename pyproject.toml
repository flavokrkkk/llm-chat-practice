[project]
name = "llm-chat"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "asyncpg==0.32.0",
    "fastapi==0.161.1",
    "httpx>=0.28.1",
    "pydantic[email]==2.14.1",
    "redis>=8.1.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
