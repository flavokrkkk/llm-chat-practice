x-backend-env: &backend-env
  DB__NAME: llm-chat
  DB__USER: llm-chat
  DB__PASSWORD: llm-chat
  DB__HOST: postgres
  DB__PORT: 5432
  REDIS__URL: redis://redis:6379/0
  CORS_ORIGINS: http://localhost:5173

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: llm-chat
      POSTGRES_PASSWORD: llm-chat
      POSTGRES_DB: llm-chat
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm-chat -d llm-chat"]
      interval: 2s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment: *backend-env
  backend:
    build: .
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
  redis:
    image: redis:7-alpine
    container_name: redis-store
    ports:
      - "6379:6379"
volumes:
  pgdata: